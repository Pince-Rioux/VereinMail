name: publish

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Package version to publish"
        required: false
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0

      - name: Build package
        run: |
          dotnet restore
          dotnet build --no-restore
          dotnet pack --no-restore
        working-directory: src/VereinMail

      - name: Publish to GitHub Packages
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          set -euo pipefail
          SRC="https://nuget.pkg.github.com/Pince-Rioux"
          nupkg=$(find src -name '*.nupkg' -print -quit)
          [ -n "$nupkg" ] || { echo "::error::no nupkg"; exit 1; }
          echo "package: $nupkg"
          HTTP_CODE=$(curl -s -o /tmp/push-response.json -w '%{http_code}' \
            -H "Authorization: Bearer ***" \
            -H "Content-Type: application/octet-stream" \
            --data-binary "@$nupkg" \
            "$SRC/")
          echo "HTTP $HTTP_CODE"
          cat /tmp/push-response.json
          [ "$HTTP_CODE" = "201" ] || [ "$HTTP_CODE" = "204" ] || {
            echo "::error::push failed (HTTP $HTTP_CODE)"
            exit 1
          }
