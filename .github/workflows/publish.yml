name: publish
permissions:
  contents: read
  packages: write
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Package version to publish"
        required: false
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0

      - name: Restore
        run: dotnet restore
        working-directory: src/VereinMail

      - name: Build
        run: dotnet build --no-restore
        working-directory: src/VereinMail

      - name: Package
        run: dotnet pack --no-restore
        working-directory: src/VereinMail

      - name: Publish to GitHub Packages
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          set -euo pipefail
          REGISTRY="https://nuget.pkg.github.com/Pince-Rioux"
          nupkg=$(find src -name '*.nupkg' -print -quit)
          [ -n "$nupkg" ] || { echo "::error::no nupkg"; exit 1; }
          echo "package: $nupkg"
          dotnet nuget push "$nupkg" \
            -s "$REGISTRY" \
            -k "$GH_PAT" \
            --skip-duplicate
      - name: Configure GitHub NuGet source
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
      
          dotnet nuget remove source github || true
      
          dotnet nuget add source \
            "https://nuget.pkg.github.com/${GH_OWNER}/index.json" \
            --name github \
            --username "${GITHUB_ACTOR}" \
            --password "${GH_TOKEN}" \
            --store-password-in-clear-text
      
      - name: Publish NuGet package
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
      
          dotnet nuget push \
            "src/VereinMail/bin/Release/VereinMail.1.0.0-dev.nupkg" \
            --source github \
            --api-key "${GH_TOKEN}" \
            --skip-duplicate
