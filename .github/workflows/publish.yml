name: publish

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Package version to publish"
        required: false
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0

      - name: Restore
        run: dotnet restore
        working-directory: src/VereinMail

      - name: Build
        run: dotnet build --no-restore
        working-directory: src/VereinMail

      - name: Package
        run: dotnet pack --no-restore
        working-directory: src/VereinMail

      - name: Publish to GitHub Packages
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          set -euo pipefail
          REGISTRY="https://nuget.pkg.github.com/Pince-Rioux/index.json"
          dotnet nuget add source "$REGISTRY" \
            -n github \
            -u 'Pince-Rioux' \
            -p "$GH_PAT" \
            --store-password-in-clear-text || true
          nupkg=$(find src -name '*.nupkg' -print -quit)
          [ -n "$nupkg" ] || { echo "::error::no nupkg"; exit 1; }
          echo "package: $nupkg"
          dotnet nuget push "$nupkg" -s "github"
