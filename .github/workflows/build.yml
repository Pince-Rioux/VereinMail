name: build

on:
  push:
    branches: [ main, feature/*, fix/* ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore VereinMail.slnx --verbosity minimal

      - name: Build
        run: dotnet build VereinMail.slnx --no-restore --configuration Release --verbosity minimal

      - name: Test
        run: dotnet test VereinMail.slnx --no-build --configuration Release --logger "console;verbosity=minimal"
