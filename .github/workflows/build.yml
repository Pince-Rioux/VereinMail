name: build

on:
  push:
    branches: [ main, feature/*, fix/* ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore tests/VereinMail.Tests/VereinMail.Tests.csproj

      - name: Build
        run: dotnet build src/VereinMail/VereinMail.csproj --no-restore --configuration Release

      - name: Test
        run: dotnet test tests/VereinMail.Tests/VereinMail.Tests.csproj --no-restore --configuration Release --logger "console;verbosity=normal"
